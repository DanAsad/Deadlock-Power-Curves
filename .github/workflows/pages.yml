# Builds the frontend in static mode, exports every API response as a JSON
# file from the committed tables in data/, and publishes to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend (static mode)
        working-directory: web
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run test:parity   # browser scoring must match the pipeline on the fixture matches
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export API responses as JSON
        run: |
          pip install pandas pyarrow fastapi
          python -m api.export_static web/dist/data
          cp web/dist/index.html web/dist/404.html   # any other address still loads the app
      - name: A real page for every route
        # Pages serves /scaling from scaling.html. Without these copies a deep link loads the app
        # through 404.html with HTTP status 404, and link previews (LinkedIn, Slack) and search engines skip it.
        run: |
          python - <<'EOF'
          import json, shutil
          from pathlib import Path
          dist = Path("web/dist")
          routes = ["power-curves", "scaling", "what-wins", "model-check", "win-probability", "live", "findings", "about"]
          routes += [f"heroes/{h['id']}" for h in json.load(open("data/heroes.json"))]
          for r in routes:
              f = dist / f"{r}.html"
              f.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy(dist / "index.html", f)
          print(len(routes), "routes")
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
